  sess.pend.forEach(function(p){(p.due<=now?due:keep).push(p.w)});
  sess.pend=keep;
  if(due.length)Array.prototype.splice.apply(sess.list,[sess.i,0].concat(due));
}
function advance(){
  sess.i++;pull();
  if(sess.i<sess.list.length)tab="card";
  else tab=sess.pend.length?"wait":"result";
  render();
}

function fly(w,btn,f,done){
  var fc=document.getElementById("fc"),tile0=document.querySelector('.side .ftile[data-tile="'+f+'"]');
  var tgt=(tile0&&tile0.offsetParent!==null)?tile0:btn;
  var r1=fc.getBoundingClientRect(),r2=tgt.getBoundingClientRect();
  var el=document.createElement("div");el.className="flyw";el.textContent=w.en;
  el.style.cssText="left:"+r1.left+"px;top:"+r1.top+"px;width:"+r1.width+"px;height:"+r1.height+"px";
  document.body.appendChild(el);fc.style.visibility="hidden";
  var dx=r2.left+r2.width/2-(r1.left+r1.width/2),dy=r2.top+r2.height/2-(r1.top+r1.height/2);
  requestAnimationFrame(function(){requestAnimationFrame(function(){el.style.transform="translate("+dx+"px,"+dy+"px) scale(.08)";el.style.opacity=".2"})});
  setTimeout(function(){el.remove();done()},580);

setTh(TH);
(function(){
  var b=document.createElement("button");b.className="thbtn";b.id="thb";b.textContent="🎨 Dizayn";document.body.appendChild(b);
  var m=document.createElement("div");m.className="thm";m.id="thm";document.body.appendChild(m);
  function draw(){
    m.innerHTML='<div class="thc"><button class="back pcl" data-x="1" aria-label="Yopish">✕</button><h2>Dizaynni tanlang</h2><div class="thg">'+
    THEMES.map(function(t){return '<button class="tt'+(t[0]===TH?' on':'')+'" data-id="'+t[0]+'" style="background:'+t[2]+';color:'+t[6]+'"><span class="tp" style="background:'+t[3]+';border-color:'+t[6]+'"><i style="background:'+t[4]+'"></i><i style="background:'+t[5]+'"></i></span><b>'+t[1]+'</b></button>'}).join("")+'</div></div>';
  }
  b.addEventListener("click",function(){draw();m.classList.add("on")});
  m.addEventListener("click",function(e){
    var x=e.target.closest("[data-id]");
    if(x){setTh(x.dataset.id);draw();return}
    if(e.target===m||e.target.closest("[data-x]"))m.classList.remove("on");
  });
})();
function confetti(){var cs=["--pri","--accent","--ok","--bad","--back"].map(function(k){return getComputedStyle(document.documentElement).getPropertyValue(k).trim()||"#F2A71B"}),h="";for(var i=0;i<48;i++){h+='<i class="cf" style="left:'+Math.random()*100+'vw;background:'+cs[i%5]+';animation-delay:'+Math.random()*.6+'s;animation-duration:'+(1.8+Math.random()*1.6)+'s;transform:rotate('+Math.random()*360+'deg)"></i>'}var d=document.createElement("div");d.className="cfw";d.innerHTML=h;document.body.appendChild(d);setTimeout(function(){d.remove()},4200)}
function render(){
  stopTm();
  roll();paintSide();
  if(tab==="wait")return waitView();
  if(tab==="fold"){app.innerHTML=foldView();return}
  if(tab==="card"){card();startTm();return}
  if(tab==="result"){result();if(sess.u===0&&sess.k>0)confetti();return}
  app.innerHTML=header()+tabs()+'<div class="fgrid fin">'+tile("r")+tile("1")+tile("3")+tile("7")+'</div>'+(tab==="dict"?'':settings())+(tab==="dict"?dictView():tab==="home"||tab==="type"?home():tab==="unk"?unkView():all());
}
app.addEventListener("click",function(e){
  if(e.target.closest("a.gl"))return;
  var el=e.target.closest("[data-say],[data-t],[data-s],[data-ty],[data-up],[data-uty],[data-pick],[data-sa],[data-sc],[data-go],[data-dir],[data-tm],[data-a],[data-addw],[data-delw],[data-fk],[data-fo],#fc");
  if(!el)return;
  if(el.dataset.say){say(el.dataset.say);return}
  if(el.dataset.fk){answerFolder(el.dataset.fk,el);return}
  if(el.dataset.fo){openF(e);return}
  if(el.dataset.addw){
    var ne=document.getElementById("nw-en"),nu=document.getElementById("nw-uz"),mg=document.getElementById("nw-msg");
    var cl=function(s){return s.replace(/[<>"&]/g,"").replace(/\s+/g," ").trim()};
    var ev=cl(ne.value),uv=cl(nu.value);
    if(!ev||!uv){mg.textContent="Ikkala maydonni ham toʻldiring.";return}
    if(WORDS.some(function(x){return x.en.toLowerCase()===ev.toLowerCase()&&x.uz.toLowerCase()===uv.toLowerCase()})){mg.textContent="Bu soʻz allaqachon bor.";return}
    var nid=WORDS.reduce(function(m,x){return Math.max(m,x.id)},30)+1;
    CW.push({id:nid,en:ev,uz:uv});saveCW();WORDS.push({id:nid,en:ev,uz:uv,ico:"📝"});
    render();document.getElementById("nw-msg").textContent="✅ Qoʻshildi: "+ev;document.getElementById("nw-en").focus();return
  }
  if(el.dataset.delw){
    var did=+el.dataset.delw;
    CW=CW.filter(function(x){return x.id!==did});saveCW();
    WORDS=WORDS.filter(function(x){return x.id!==did});delete S[did];delete SEL[did];save();render();return
  }
  if(el.dataset.dir){CFG.dir=el.dataset.dir;saveCfg();render();return}
  if(el.dataset.tm!==undefined){CFG.t=+el.dataset.tm;saveCfg();render();return}
  if(el.id==="fc"){el.classList.toggle("flip");document.getElementById("stage").classList.add("shown");stopTm();if(CFG.dir==="ue"&&el.classList.contains("flip"))say(sess.list[sess.i].en);return}
  if(el.dataset.t){tab=el.dataset.t;render();return}
  if(el.dataset.s){var n=+el.dataset.s;start(WORDS.slice(n*5,n*5+5),n);return}
  if(el.dataset.ty){var n2=+el.dataset.ty;start(WORDS.slice(n2*5,n2*5+5),n2,"t");return}
  if(el.dataset.uty){var u2=unk();if(u2.length)start(u2,-1,"t");return}
  if(el.dataset.pick||el.dataset.sa||el.dataset.sc){
    if(el.dataset.pick){var pid=el.dataset.pick;if(SEL[pid])delete SEL[pid];else SEL[pid]=1}
    else if(el.dataset.sa){WORDS.forEach(function(x){SEL[x.id]=1})}
    else{SEL={}}
    var y=window.scrollY;render();window.scrollTo(0,y);return
  }
  if(el.dataset.go){var L=WORDS.filter(function(x){return SEL[x.id]});if(L.length)start(L,-2,el.dataset.go);return}
  if(el.dataset.up){var u=unk();if(u.length)start(u,-1,el.dataset.up==="t"?"t":"c");return}
  var a=el.dataset.a;
  if(a==="home"){tab="home";render()}
  else if(a==="end"){tab="result";render()}
  else if(a==="next"){var m=sess.n+1;start(WORDS.slice(m*5,m*5+5),m,sess.m)}
  else if(a==="hint"){var hw=sess.list[sess.i];document.getElementById("th").textContent="Maslahat: "+hw.en.split("").map(function(c,i){return c===" "||i===0?c:"_"}).join(" ")}
  else if(a==="check"){
    var cw=sess.list[sess.i],v=document.getElementById("ti").value.trim().toLowerCase().replace(/\s+/g," ");
    if(!v&&!sess.to)return;stopTm();
    var ok=!sess.to&&v===cw.en.toLowerCase();
    S[cw.id]=ok?"k":"u";save();if(ok)sess.k++;else sess.u++;
    document.getElementById("fb").innerHTML='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'✅ Toʻgʻri!':'❌ Xato. Toʻgʻrisi: <b>'+cw.en+'</b>')+'</div>';
    document.getElementById("ti").disabled=true;
    var cb=document.getElementById("chk");cb.textContent="Keyingi →";cb.dataset.a="tnext";sess.to=false;
  }
  else if(a==="tnext"){advance()}
  else if(a==="wnow"){sess.pend.forEach(function(p){p.due=0});pull();tab="card";render()}
  else if(a==="fstart"){var rd0=ready();if(rd0.length)start(rd0,-2,"c")}
  else if(a==="yes"||a==="no"){
    var w=sess.list[sess.i];
    S[w.id]=a==="yes"?"k":"u";save();
    if(a==="yes")sess.k++;else sess.u++;
    sess.i++;
    tab=sess.i>=sess.list.length?"result":"card";render();
  }
});
render();
document.addEventListener("input",function(e){
  if(e.target.id!=="ti"||tab!=="card"||!sess||sess.m!=="t")return;
  var cb=document.getElementById("chk");if(!cb||cb.dataset.a!=="check")return;
  var w=sess.list[sess.i];
  if(e.target.value.trim().toLowerCase().replace(/\s+/g," ")===w.en.toLowerCase()){tone(988,0,.1,.35);tone(1319,.11,.16,.35);vib(40);cb.click()}
});
document.addEventListener("keydown",function(e){
  if(tab==="dict"&&e.key==="Enter"&&e.target&&e.target.id){e.preventDefault();if(e.target.id==="nw-en")document.getElementById("nw-uz").focus();else if(e.target.id==="nw-uz")document.getElementById("nw-add").click();return}
  if(e.key==="Enter"&&tab==="card"&&sess&&sess.m==="t"){var b=document.getElementById("chk");if(b){e.preventDefault();b.click()}}
});
(function(){
  var el=document.getElementById("tm"),C=276.46,T={total:600,left:600,run:false,end:0,iv:0,ac:null};
  var chips=[5,10,15,25].map(function(m){return '<button class="chip" data-m="'+m+'">'+m+' daq</button>'}).join("")+
    '<button class="chip" data-d="-60">−1</button><button class="chip" data-d="60">+1</button>';
  el.innerHTML='<div class="tm" id="tmc"><div class="ring"><svg viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="44"/><circle class="pg" id="tpg" cx="50" cy="50" r="44"/></svg><b id="ttx">10:00</b></div>'+
    '<div class="tctl"><div class="tt" id="ttt">⏱ Mashq taymeri</div><div class="chips" id="tch">'+chips+'</div>'+
    '<div class="tb"><button class="btn" id="tgo">▶ Boshlash</button><button class="btn alt" id="trs" aria-label="Qayta">↺</button></div></div></div>';
  var tx=document.getElementById("ttx"),pg=document.getElementById("tpg"),go=document.getElementById("tgo"),box=document.getElementById("tmc"),tt=document.getElementById("ttt");
  function f(s){var m=Math.floor(s/60),c=s%60;return (m<10?"0":"")+m+":"+(c<10?"0":"")+c}
  function draw(){
    tx.textContent=f(T.left);pg.style.strokeDashoffset=C*(1-T.left/T.total);
    go.textContent=T.run?"⏸ Pauza":(T.left===0?"▶ Qayta":(T.left<T.total?"▶ Davom":"▶ Boshlash"));
    tt.textContent=T.left===0?"🎉 Vaqt tugadi!":"⏱ Mashq taymeri";
    box.classList.toggle("done",T.left===0);
    Array.prototype.forEach.call(document.querySelectorAll("#tch [data-m]"),function(b){b.classList.toggle("on",T.total===+b.dataset.m*60)});
  }
  function stop(){T.run=false;clearInterval(T.iv)}
  function beep(){alarmLoud()}
  function beepOld(){
    try{T.ac=T.ac||new (window.AudioContext||window.webkitAudioContext)();
      [0,.25,.5].forEach(function(d){var o=T.ac.createOscillator(),g=T.ac.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(T.ac.destination);o.start(T.ac.currentTime+d);o.stop(T.ac.currentTime+d+.15)})}catch(e){}
    try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  }
  function tick(){
    var l=Math.max(0,Math.ceil((T.end-Date.now())/1000));
    if(l!==T.left){T.left=l;draw()}
    if(l===0){stop();draw();beep()}
  }
  go.addEventListener("click",function(){
    try{T.ac=T.ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
    if(T.run){stop();draw();return}
    if(T.left===0)T.left=T.total;
    T.run=true;T.end=Date.now()+T.left*1000;T.iv=setInterval(tick,250);draw();
  });
  document.getElementById("trs").addEventListener("click",function(){stop();T.left=T.total;draw()});
  document.getElementById("tch").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    stop();
    if(b.dataset.m)T.total=+b.dataset.m*60;
    else T.total=Math.max(60,Math.min(180*60,T.total+(+b.dataset.d)));
    T.left=T.total;draw();
  });
  draw();
})();
</script>
</body>
</html>
